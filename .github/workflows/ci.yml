name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  runtime-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:standalone -- linux-x64
      - run: |
          package_version=$(node -p "require('./package.json').version")
          tar -C standalone -czf mcp-vscode-linux-x64.tar.gz mcp-vscode-${package_version}-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-vscode-linux-x64
          path: mcp-vscode-linux-x64.tar.gz

  runtime-package-windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: npm run package:standalone -- win32-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VSCODE_BUILD_ROOT: ${{ runner.temp }}\mcp-vscode-openvscode-build
      - run: npm run test:runtime
        env:
          MCP_VSCODE_REAL_RUNTIME_ROOT: ${{ github.workspace }}\runtime\openvscode-server
      - shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          Compress-Archive -LiteralPath "standalone\mcp-vscode-$packageVersion-win32-x64" -DestinationPath mcp-vscode-win32-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-vscode-win32-x64
          path: mcp-vscode-win32-x64.zip

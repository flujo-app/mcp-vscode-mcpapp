<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>MCP VS Code</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
        background: #181818;
        color: #cccccc;
      }
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; min-height: 520px; margin: 0; overflow: hidden; }
      body { background: var(--color-background-primary, #181818); }
      .shell { display: grid; grid-template-rows: 38px minmax(0, 1fr) 22px; width: 100%; height: 100%; }
      .titlebar {
        display: flex; align-items: center; gap: 9px; padding: 0 8px 0 12px;
        background: #181818; border-bottom: 1px solid #2b2b2b; user-select: none;
      }
      .mark { width: 17px; height: 17px; color: #23a8f2; flex: 0 0 auto; }
      .title { font-size: 12px; font-weight: 600; color: #dedede; letter-spacing: .01em; }
      .subtitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: #8f8f8f; }
      .spacer { flex: 1; }
      button {
        border: 0; border-radius: 4px; padding: 5px 8px; color: #c9c9c9; background: transparent;
        font: inherit; font-size: 11px; cursor: pointer;
      }
      button:hover { background: #2a2d2e; color: #fff; }
      button:focus-visible { outline: 1px solid #007fd4; outline-offset: 1px; }

      .content { position: relative; min-height: 0; background: #1e1e1e; }
      .workbench-frame { display: block; width: 100%; height: 100%; border: 0; background: #1e1e1e; }
      .workbench-frame[hidden] { display: none; }

      .native-shell { display: flex; width: 100%; height: 100%; }
      .native-shell[hidden] { display: none; }
      .explorer {
        width: 220px; flex: 0 0 auto; overflow: auto; background: #181818; border-right: 1px solid #2b2b2b;
        padding: 6px 0; font-size: 12.5px;
      }
      .tree, .tree li { list-style: none; margin: 0; padding: 0; }
      .tree { padding-left: 12px; }
      .tree-row { padding: 2px 6px; border-radius: 3px; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tree-row--expandable { cursor: pointer; }
      .tree-row--expandable::before { content: "▸ "; color: #8f8f8f; }
      .tree-row--open::before { content: "▾ "; }
      .tree-row:hover { background: #2a2d2e; }
      .tree-more, .explorer-error { padding: 4px 8px; color: #8f8f8f; font-size: 11px; }

      .editor-area { flex: 1; min-width: 0; display: grid; grid-template-rows: 32px minmax(0, 1fr); }
      .tabs { display: flex; align-items: center; gap: 2px; overflow-x: auto; background: #181818; border-bottom: 1px solid #2b2b2b; }
      .tab {
        display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 32px; font-size: 12px;
        color: #a9a9a9; border-right: 1px solid #2b2b2b; cursor: pointer; white-space: nowrap;
      }
      .tab--active { background: #1e1e1e; color: #f0f0f0; }
      .tab--dirty span::after { content: " •"; }
      .tab-close { padding: 0 3px; font-size: 13px; line-height: 1; color: #8f8f8f; }
      .tab-close:hover { color: #fff; background: transparent; }

      .conflict-banner {
        display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #5a3d00; color: #ffd479;
        font-size: 12px; flex-wrap: wrap;
      }
      .conflict-banner[hidden] { display: none; }
      .conflict-banner button { background: #00000030; color: #ffe9b3; }

      .editor-container { min-height: 0; }
      .terminal-panel { display: flex; flex-direction: column; height: 30%; border-top: 1px solid #2b2b2b; background: #181818; }
      .terminal-panel-header {
        display: flex; align-items: center; justify-content: space-between; padding: 3px 8px;
        font-size: 11px; color: #8f8f8f; border-bottom: 1px solid #2b2b2b;
      }
      .terminal-container { flex: 1; min-height: 0; padding: 4px 6px; overflow: hidden; }

      .cover {
        position: absolute; inset: 0; display: grid; place-items: center; padding: 32px;
        background: radial-gradient(circle at 50% 30%, #232b34 0, #1e1e1e 38%, #181818 100%);
      }
      .cover[hidden] { display: none; }
      .card { max-width: 540px; text-align: center; }
      .large-mark { width: 68px; color: #23a8f2; margin: 0 auto 18px; }
      h1 { margin: 0 0 8px; font-size: 22px; font-weight: 500; color: #f0f0f0; }
      .message { margin: 0 auto; color: #a9a9a9; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
      .details { margin-top: 14px; color: #d7ba7d; font: 11px/1.5 var(--font-mono, Consolas, monospace); }
      .open-browser {
        display: inline-block; margin-top: 18px; padding: 8px 16px; border-radius: 4px;
        background: #0e639c; color: #fff; text-decoration: none; font-size: 13px;
      }
      .open-browser:hover { background: #1177bb; }
      .open-browser[hidden] { display: none; }

      .statusbar {
        display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0 9px;
        background: #007acc; color: #fff; font-size: 11px; user-select: none;
      }
      .statusbar.error { background: #a1260d; }
      .status-item { display: inline-flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
      .tier-badge { padding: 1px 6px; border-radius: 3px; background: #ffffff26; }
      .right { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
      @media (max-width: 620px) { .subtitle { display: none; } .titlebar { padding-left: 8px; } .explorer { width: 160px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>/*__MCP_VSCODE_APP__*/</script>
  </body>
</html>

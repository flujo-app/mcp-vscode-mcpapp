name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  runtime-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:standalone -- linux-x64
      - run: tar -C standalone -czf mcp-vscode-linux-x64.tar.gz mcp-vscode-0.1.0-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-vscode-linux-x64
          path: mcp-vscode-linux-x64.tar.gz

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: Existing stable release tag whose audited npm assets should be published
        required: true
        type: string
      source_run_id:
        description: Failed release run whose successful Linux and dispatcher artifacts should be reused
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-releases
  queue: max

jobs:
  standalone:
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: win32-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    # Native OpenVSCode Windows builds regularly exceed 150 minutes on hosted
    # runners. Give the automatic release enough time to finish rather than
    # cancelling the entire npm publication after all other targets succeed.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.target == 'win32-x64' && '22.21.1' || '22' }}
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs ${{ github.ref_name }}
      - run: npm run check
      - run: npm run package:standalone -- ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VSCODE_BUILD_ROOT: ${{ matrix.target == 'win32-x64' && format('{0}\mcp-vscode-openvscode-build', runner.temp) || '' }}
      - name: Archive Linux release
        if: startsWith(matrix.target, 'linux-')
        run: |
          package_version=$(node -p "require('./package.json').version")
          tar -C standalone -czf mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz mcp-vscode-${package_version}-${{ matrix.target }}
          sha256sum mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - name: Archive Windows release
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $archive = "mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -LiteralPath "standalone\mcp-vscode-$packageVersion-${{ matrix.target }}" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          node -e "const{writeFileSync}=require('node:fs');writeFileSync(process.argv[1],process.argv[2]+'\n')" "$archive.sha256" "$hash  $archive"
      # Every target now produces an npm runtime package, so `npx` works on all of
      # them rather than Windows alone.
      - name: Pack platform npm runtime package
        shell: bash
        run: |
          node scripts/build-platform-packages.mjs ${{ matrix.target }}
          packed=$(cd platform-packages/${{ matrix.target }} && npm pack --silent | tail -n 1)
          archive="mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.npm.tgz"
          mv "platform-packages/${{ matrix.target }}/${packed}" "$archive"
          node -e "const{createHash}=require('node:crypto'),{readFileSync}=require('node:fs');const a=process.argv[1];const h=createHash('sha256').update(readFileSync(a)).digest('hex');require('node:fs').writeFileSync(a+'.sha256',h+'  '+a+'\n')" "$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-vscode-${{ matrix.target }}-release
          path: mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.*
      - name: Test native Windows runtime
        if: matrix.target == 'win32-x64'
        run: npm run test:runtime
        env:
          MCP_VSCODE_REAL_RUNTIME_ROOT: ${{ github.workspace }}\runtime\openvscode-server

  # The dispatcher carries no runtime, so it builds on Linux in seconds instead of
  # waiting on the ~1.5h native Windows OpenVSCode build.
  dispatcher:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs ${{ github.ref_name }}
      - name: Select the platform runtime version
        id: runtime-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            runtime_version=$(
              git tag --merged HEAD |
                node -e 'const fs=require("node:fs"),semver=require("semver");const versions=fs.readFileSync(0,"utf8").split(/\s+/).filter(tag=>tag.startsWith("v")&&semver.valid(tag.slice(1))&&!semver.prerelease(tag.slice(1))).map(tag=>tag.slice(1)).sort(semver.rcompare);process.stdout.write(versions[0]??"")'
            )
            if [[ -z "$runtime_version" ]]; then
              echo "::error::No stable release tag is reachable from prerelease $GITHUB_REF_NAME."
              exit 1
            fi
          else
            runtime_version=$(node -p "require('./package.json').version")
          fi
          echo "version=$runtime_version" >>"$GITHUB_OUTPUT"
          echo "dispatcher will use platform runtime packages $runtime_version"
      - run: npm run npm:prepare-manifest
        env:
          MCP_VSCODE_RUNTIME_VERSION: ${{ steps.runtime-version.outputs.version }}
      - name: Pack dispatcher npm package
        env:
          MCP_VSCODE_RUNTIME_VERSION: ${{ steps.runtime-version.outputs.version }}
        run: |
          packed=$(npm pack --silent | tail -n 1)
          archive="mcp-vscode-${{ github.ref_name }}-dispatcher.npm.tgz"
          mv "$packed" "$archive"
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-vscode-dispatcher-release
          path: mcp-vscode-${{ github.ref_name }}-dispatcher.*

  publish:
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    needs: [standalone, dispatcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mcp-vscode-*-release
          path: artifacts
          merge-multiple: true
      - name: Upload assets without replacing Release Please notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          checksums=(artifacts/*.sha256)
          ((${#files[@]} > 0)) || { echo "::error::No release artifacts were downloaded."; exit 1; }
          ((${#checksums[@]} > 0)) || { echo "::error::No release checksums were downloaded."; exit 1; }
          (cd artifacts && sha256sum --check -- *.sha256)

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          upload=()
          for file in "${files[@]}"; do
            name=$(basename "$file")
            match=$(jq --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$release_json")
            count=$(jq 'length' <<<"$match")
            if (( count == 0 )); then
              upload+=("$file")
              continue
            fi
            if (( count > 1 )); then
              echo "::error::GitHub Release contains duplicate assets named $name."
              exit 1
            fi

            local_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            remote_digest=$(jq -r '.[0].digest // empty' <<<"$match")
            if [[ -z "$remote_digest" ]]; then
              asset_id=$(jq -r '.[0].id' <<<"$match")
              temporary_asset=$(mktemp)
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >"$temporary_asset"
              remote_digest="sha256:$(sha256sum "$temporary_asset" | cut -d' ' -f1)"
              rm -f "$temporary_asset"
            fi
            if [[ "$remote_digest" != "$local_digest" ]]; then
              echo "::error::Refusing to replace $name: the release has $remote_digest, but this run built $local_digest."
              exit 1
            fi
            echo "unchanged release asset: $name"
          done
          if (( ${#upload[@]} > 0 )); then
            gh release upload "$GITHUB_REF_NAME" "${upload[@]}"
          fi

  # Publish the platform runtime packages BEFORE the dispatcher: the dispatcher
  # pins them as optionalDependencies, so releasing it first would leave a window
  # where `npx` resolves a dispatcher whose runtime packages do not exist yet.
  publish-npm:
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    needs: [standalone, dispatcher, publish]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable npm trusted publishing
        run: npm install --global npm@latest
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: mcp-vscode-*-release
          path: artifacts
          merge-multiple: true
      - name: Verify and publish the audited npm artifacts
        run: npm run npm:publish -- artifacts --trusted-publishing

  # A timed-out matrix keeps successful job artifacts but skips the release and
  # npm jobs. Preserve those audited bytes on the existing GitHub Release while
  # the missing Windows target is rebuilt separately.
  recover-existing-assets:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: mcp-vscode-*-release
          path: artifacts
          merge-multiple: true
      - name: Verify and preserve successful release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.source_run_id }}")
          [[ $(jq -r '.head_branch' <<<"$source_run") == "${{ inputs.recovery_tag }}" ]] || {
            echo "::error::Run ${{ inputs.source_run_id }} does not belong to tag ${{ inputs.recovery_tag }}."
            exit 1
          }
          files=(artifacts/*)
          checksums=(artifacts/*.sha256)
          ((${#files[@]} > 0)) || { echo "::error::No artifacts were recovered from run ${{ inputs.source_run_id }}."; exit 1; }
          ((${#checksums[@]} > 0)) || { echo "::error::The recovered artifacts have no checksums."; exit 1; }
          (cd artifacts && sha256sum --check -- *.sha256)
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.recovery_tag }}")
          upload=()
          for file in "${files[@]}"; do
            name=$(basename "$file")
            match=$(jq --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$release_json")
            if [[ $(jq 'length' <<<"$match") == 0 ]]; then
              upload+=("$file")
              continue
            fi
            local_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            remote_digest=$(jq -r '.[0].digest // empty' <<<"$match")
            [[ "$remote_digest" == "$local_digest" ]] || {
              echo "::error::Existing release asset $name does not match the recovered artifact."
              exit 1
            }
            echo "unchanged release asset: $name"
          done
          ((${#upload[@]} == 0)) || gh release upload "${{ inputs.recovery_tag }}" "${upload[@]}"

  recover-windows-assets:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recovery_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.21.1
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs ${{ inputs.recovery_tag }}
      - run: npm run check
      - run: npm run package:standalone -- win32-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VSCODE_BUILD_ROOT: ${{ format('{0}\mcp-vscode-openvscode-build', runner.temp) }}
      - name: Archive Windows release
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $archive = "mcp-vscode-${{ inputs.recovery_tag }}-win32-x64.zip"
          Compress-Archive -LiteralPath "standalone\mcp-vscode-$packageVersion-win32-x64" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          node -e "const{writeFileSync}=require('node:fs');writeFileSync(process.argv[1],process.argv[2]+'\n')" "$archive.sha256" "$hash  $archive"
      - name: Pack Windows npm runtime package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-platform-packages.mjs win32-x64
          packed=$(cd platform-packages/win32-x64 && npm pack --silent | tail -n 1)
          archive="mcp-vscode-${{ inputs.recovery_tag }}-win32-x64.npm.tgz"
          mv "platform-packages/win32-x64/${packed}" "$archive"
          node -e "const{createHash}=require('node:crypto'),{readFileSync}=require('node:fs');const a=process.argv[1];const h=createHash('sha256').update(readFileSync(a)).digest('hex');require('node:fs').writeFileSync(a+'.sha256',h+'  '+a+'\n')" "$archive"
      # Save the expensive native result before any release-API interaction so
      # a transient upload or verification failure never forces another build.
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-vscode-win32-x64-release
          path: mcp-vscode-${{ inputs.recovery_tag }}-win32-x64.*
      - name: Preserve rebuilt Windows artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(mcp-vscode-${{ inputs.recovery_tag }}-win32-x64*)
          ((${#files[@]} == 4)) || { echo "::error::Expected four Windows release files, found ${#files[@]}."; exit 1; }
          (sha256sum --check -- *.sha256)
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/${{ inputs.recovery_tag }}")
          upload=()
          for file in "${files[@]}"; do
            name=$(basename "$file")
            match=$(jq --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$release_json")
            if [[ $(jq 'length' <<<"$match") == 0 ]]; then
              upload+=("$file")
              continue
            fi
            local_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            remote_digest=$(jq -r '.[0].digest // empty' <<<"$match")
            [[ "$remote_digest" == "$local_digest" ]] || {
              echo "::error::Existing release asset $name does not match the rebuilt artifact."
              exit 1
            }
            echo "unchanged release asset: $name"
          done
          ((${#upload[@]} == 0)) || gh release upload "${{ inputs.recovery_tag }}" "${upload[@]}"

  # Publish only after every platform artifact exists on the immutable release.
  recover-npm:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [recover-existing-assets, recover-windows-assets]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recovery_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the recovery checkout and tag
        run: node scripts/verify-release-tag.mjs "${{ inputs.recovery_tag }}"
      - name: Enable npm trusted publishing
        run: npm install --global npm@latest
      - run: npm ci --ignore-scripts
      - name: Download the existing audited npm release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir artifacts
          gh release download "${{ inputs.recovery_tag }}" \
            --dir artifacts \
            --pattern '*.npm.tgz' \
            --pattern '*.npm.tgz.sha256'
          (cd artifacts && sha256sum --check -- *.npm.tgz.sha256)
      - name: Verify and publish the existing audited npm artifacts
        run: npm run npm:publish -- artifacts --trusted-publishing

  # Prereleases reuse the already-published OpenVSCode runtime packages and
  # publish only the small dispatcher/app layer. This keeps browser fixes
  # testable in minutes instead of rebuilding an unchanged Windows runtime.
  publish-npm-prerelease:
    if: ${{ github.event_name == 'push' && contains(github.ref_name, '-') }}
    needs: dispatcher
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Enable npm trusted publishing
        run: npm install --global npm@latest
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: mcp-vscode-dispatcher-release
          path: artifacts
      - name: Verify and publish the prerelease dispatcher
        run: npm run npm:publish -- artifacts --trusted-publishing --dispatcher-only --tag beta

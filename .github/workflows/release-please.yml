name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_APP_CLIENT_ID_CONFIGURED: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
      RELEASE_APP_PRIVATE_KEY_CONFIGURED: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Report missing GitHub App configuration
        if: ${{ env.RELEASE_APP_CLIENT_ID_CONFIGURED != 'true' || env.RELEASE_APP_PRIVATE_KEY_CONFIGURED != 'true' }}
        run: |
          echo "::notice::Release Please is inactive. Set the RELEASE_APP_CLIENT_ID repository variable and RELEASE_APP_PRIVATE_KEY repository secret to enable it."

      - name: Create repository-scoped GitHub App token
        if: ${{ env.RELEASE_APP_CLIENT_ID_CONFIGURED == 'true' && env.RELEASE_APP_PRIVATE_KEY_CONFIGURED == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update the release pull request
        if: ${{ env.RELEASE_APP_CLIENT_ID_CONFIGURED == 'true' && env.RELEASE_APP_PRIVATE_KEY_CONFIGURED == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

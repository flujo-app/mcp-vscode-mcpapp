name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  standalone:
    strategy:
      matrix:
        target: [linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:standalone -- ${{ matrix.target }}
      - name: Archive
        run: |
          tar -C standalone -czf mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz mcp-vscode-0.1.0-${{ matrix.target }}
          sha256sum mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

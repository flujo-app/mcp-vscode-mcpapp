name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: win32-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: matrix.target == 'win32-x64'
        with:
          repository: gitpod-io/openvscode-server
          ref: 4ffe2270acdf711bbefecc3e8c79f4b3631640e5
          path: _openvscode-source
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.target == 'win32-x64' && '22.21.1' || '22' }}
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs ${{ github.ref_name }}
      - run: npm run check
      - run: npm run package:standalone -- ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCP_VSCODE_OPENVSCODE_SOURCE: ${{ matrix.target == 'win32-x64' && format('{0}\_openvscode-source', github.workspace) || '' }}
      - name: Test native Windows runtime
        if: matrix.target == 'win32-x64'
        run: npm run test:runtime
        env:
          MCP_VSCODE_REAL_RUNTIME_ROOT: ${{ github.workspace }}\runtime\openvscode-server
      - name: Archive Linux release
        if: startsWith(matrix.target, 'linux-')
        run: |
          package_version=$(node -p "require('./package.json').version")
          tar -C standalone -czf mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz mcp-vscode-${package_version}-${{ matrix.target }}
          sha256sum mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
      - name: Archive Windows release
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $archive = "mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -LiteralPath "standalone\mcp-vscode-$packageVersion-${{ matrix.target }}" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $archive"
      - name: Pack Windows npm package
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          npm run npm:prepare-manifest
          $packed = (npm pack --silent | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath $packed)) { throw "npm pack did not create $packed" }
          $archive = "mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.npm.tgz"
          Move-Item -LiteralPath $packed -Destination $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -Value "$hash  $archive"
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-vscode-${{ matrix.target }}-release
          path: mcp-vscode-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: standalone
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mcp-vscode-*-release
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
